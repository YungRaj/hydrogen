[tool.black]
line-length = 88
target-version = ["py310"]
required-version = "25.1.0"
skip-string-normalization = true
include = "\\.pyi?$"
extend-exclude = '''
(^|/)(
    \.git/
  | results/
  | models/
  | mechanisms/
  | run_production_campaign\.py$
  | run_validation_campaign\.py$
  | runsweep\.py$
  | pipeline/campaigns/full_physics\.py$
  | pipeline/campaigns/ledger\.py$
  | pipeline/evidence/design_space_audit\.py$
  | pipeline/evidence/experimental_dataset\.py$
  | pipeline/evidence/prior_art\.py$
  | pipeline/orchestrator\.py$
  | pipeline/reactors/reactor_core\.py$
  | pipeline/reactors/sweeps/runner\.py$
  | pipeline/search/design_space\.py$
  | pipeline/simulation/case_preparation\.py$
  | pipeline/simulation/external_runner\.py$
  | pipeline/simulation/physical_case\.py$
  | pipeline/stages/orchestration\.py$
  | pipeline/transport/training\.py$
  | pipeline/validation/candidate_hamiltonian\.py$
  | pipeline/validation/task_queue\.py$
)
'''
