name: CPU contracts

on:
  push:
  pull_request:

jobs:
  prospective-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install numpy pandas scipy scikit-learn pytest
      - run: python -m pytest -q tests/test_prospective_contracts.py
